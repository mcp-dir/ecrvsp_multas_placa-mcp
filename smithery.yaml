# Smithery configuration for ECRVSP Multas RENAINF: Por Placa
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ecrvsp_multas_placa

name: ecrvsp_multas_placa-mcp
displayName: "ECRVSP Multas RENAINF: Por Placa"
description: >
  ECRVSP Multas RENAINF: Por Placa, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ecrvsp_multas_placa-mcp
repository: https://github.com/mcp-dir/ecrvsp_multas_placa-mcp

tags:
  - ecrvsp_multas_placa
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ecrvsp_multas_placa

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ecrvsp_multas_placa/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
